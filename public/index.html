<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#121417" />
  <title>New API</title>
  <link rel="icon" href="https://res.oplist.org/logo/logo.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="focus-field" id="focusField" aria-hidden="true"></div>

  <main class="stage">
    <button class="bell glass" id="bellButton" type="button" aria-label="通知" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M10 21h4"></path>
      </svg>
      <span class="bell-dot" id="bellDot" aria-hidden="true"></span>
    </button>

    <section class="notice-panel" id="noticePanel" aria-hidden="true" aria-label="系统公告">
      <div class="panel-sheen" id="panelSheen" aria-hidden="true"></div>

      <div class="panel-inner" id="panelInner">
        <div class="notice-head">
          <div>
            <h2>系统公告</h2>
            <p>最新平台更新和通知</p>
          </div>
          <button class="icon-button" id="closeNotice" type="button" aria-label="关闭通知">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M6 6l12 12M18 6L6 18"></path>
            </svg>
          </button>
        </div>

        <div class="tabs" role="tablist" aria-label="公告视图">
          <button class="tab is-active" type="button" data-tab="notice" role="tab" aria-selected="true">通知</button>
          <button class="tab" type="button" data-tab="timeline" role="tab" aria-selected="false">时间线</button>
        </div>

        <div class="notice-scroll" id="noticeScroll">
          <div class="notice-view" id="noticeView"></div>
          <div class="timeline-view" id="timelineView" hidden></div>
        </div>

        <div class="notice-foot">
          <span class="status"><i></i> ALL SYSTEMS OPERATIONAL</span>
          <button class="soft-button" id="refreshNotice" type="button">刷新</button>
        </div>
      </div>
    </section>
  </main>

  <details class="contact glass" id="contact">
    <summary class="contact-summary">
      <span class="contact-email">Meetfriends520@gmail.com</span>
    </summary>

    <div class="contact-actions">
      <span class="contact-divider"></span>

      <button class="contact-action copy-action" id="copyEmail" type="button" aria-label="复制邮箱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="8" y="8" width="11" height="11" rx="2"></rect>
          <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
        </svg>
        <span id="copyLabel">COPY</span>
      </button>

      <a class="contact-action" href="https://mail.google.com/mail/?view=cm&fs=1&to=Meetfriends520%40gmail.com" target="_blank" rel="noopener noreferrer">
        GMAIL
      </a>

      <a class="contact-action" href="https://outlook.office.com/mail/deeplink/compose?to=Meetfriends520%40gmail.com" target="_blank" rel="noopener noreferrer">
        OUTLOOK
      </a>

      <a class="contact-action" href="https://mail.qq.com/cgi-bin/frame_html?url=compose&to=Meetfriends520%40gmail.com" target="_blank" rel="noopener noreferrer">
        QQ邮箱
      </a>
    </div>
  </details>

  <script src="/app.js" defer></script>
</body>
</html>
